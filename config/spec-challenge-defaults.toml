# Sentinel A13 spec-challenge enforcement mode — shipped defaults.
#
# Read by `sentinel_infrastructure::spec_challenge_config::SpecChallengeConfig`
# at sentinel startup via `include_str!`. Operators override in
# `~/.claude/sentinel/config/spec-challenge.toml`; the loader merges
# operator overrides on top.
#
# Enterprise production baseline is `DefaultBlocking`: Irreversible+
# work must carry a complete spec challenge by default, and
# Catastrophic-class challenges must pass semantic scoring. Operators may
# explicitly choose `ObserveOnly` only for local diagnostics. For
# high-stakes domains where Irreversible work should also be
# semantically scored, use `StrictBlocking`.
#
# Mode values: ObserveOnly | DefaultBlocking | StrictBlocking.
#
# - `ObserveOnly`: hook runs the completeness check + logs would-be
#   blocks via `tracing::info` but never returns `deny()`. Diagnostics only.
# - `DefaultBlocking`: class-graded per spec §3. TriviallyReversible
#   skipped, ReversibleWithEffort optional, Irreversible requires a
#   complete challenge, Catastrophic also requires every scorer
#   axis ≥ catastrophic_axis_threshold.
# - `StrictBlocking`: Irreversible work is also scored (treated as
#   Catastrophic semantically). For domains where shipping with
#   shallow alternatives or fake-empty categories is unacceptable.

[spec_challenge_gate]
# TEMPORARILY ObserveOnly (2026-07-25) — NOT a judgement on A13's design.
#
# `DefaultBlocking` is unsatisfiable as shipped: the gate requires a
# SpecChallenge artifact in `HookInput.extra.spec_challenge`, but the tool that
# would let an agent submit one — `mcp__sentinel__emit_challenge` — does not
# exist. It appears only in docs/a13-spec-challenge.md, where §14 lists building
# it as something *ratification would commit to*. That signature block is still
# blank. So enforcement shipped without its delivery mechanism, and an agent
# hitting this gate cannot get past it by any means.
#
# Restore `DefaultBlocking` as soon as the emit path exists. ObserveOnly keeps
# the completeness check and still logs every would-be block, so no telemetry
# is lost in the meantime.

mode = "ObserveOnly"

# Minimum per-axis score (0.0-1.0) the scorer must return for a
# Catastrophic-class challenge to pass. Operators tune this per
# deployment — frontier-model judges typically calibrate around 0.6-0.8
# on substantive challenges, so 0.7 is the v1 default. Lower values
# admit weaker challenges; higher values demand stronger pre-action
# articulation.
catastrophic_axis_threshold = 0.7
