# ---------------------------------------------------------------------------
# Layer 3: Bash command patterns
# ---------------------------------------------------------------------------
#
# First-match wins. Order matters: put the most-specific catastrophic
# patterns FIRST so they classify before more-general patterns demote
# them.
#
# Regex syntax is the `regex` crate's flavor — no look-around. Patterns
# match anywhere in the command string unless anchored with `^`/`$`.
#
# When NO pattern matches, the adapter falls back to ReversibleWithEffort
# (the conservative Bash default — assume any unrecognized command
# is mutating).

# --- Catastrophic: irrecoverable + high blast radius -----------------------

[[bash.pattern]]
match = "^rm[[:space:]]+-rf[[:space:]]+/[[:space:]]*$"
class = "Catastrophic"
# rm -rf / — root-deletion.

# --- PowerShell destructive verbs (shares this list with Bash via the
# `PowerShell` dispatch arm; PS uses the same tool_input.command field) ---

[[bash.pattern]]
match = "(?i)Remove-Item[[:space:]].*-Recurse.*-Force"
class = "Catastrophic"
# Remove-Item -Recurse -Force — PowerShell's `rm -rf`. Order of flags
# varies, so both orderings are caught by the next pattern too.

[[bash.pattern]]
match = "(?i)Remove-Item[[:space:]].*-Force.*-Recurse"
class = "Catastrophic"
# Same as above with -Force before -Recurse.

[[bash.pattern]]
match = "(?i)(Format-Volume|Clear-Disk|Remove-Partition|Initialize-Disk)"
class = "Catastrophic"
# Disk-level PowerShell cmdlets — wipe volumes/partitions.

[[bash.pattern]]
match = "(?i)Remove-Item[[:space:]].*(HKLM:|HKCU:|HKEY)"
class = "Catastrophic"
# Registry key deletion via Remove-Item on a registry PSDrive.

[[bash.pattern]]
match = "^rm[[:space:]]+-rf[[:space:]]+[^./]"
class = "Catastrophic"
# rm -rf <abs-or-bare-name> — non-relative deletion.

[[bash.pattern]]
match = "(?i)DROP[[:space:]]+(DATABASE|TABLE|SCHEMA)"
class = "Catastrophic"
# SQL drop statements.

[[bash.pattern]]
match = "(?i)TRUNCATE[[:space:]]+TABLE"
class = "Catastrophic"
# SQL truncate.

[[bash.pattern]]
match = "git[[:space:]]+push[[:space:]]+(--force|-f)[[:space:]]+.*[[:space:]]+(main|master)"
class = "Catastrophic"
# Force-push to a protected branch.

[[bash.pattern]]
match = "terraform[[:space:]]+destroy.*(prod|production)"
class = "Catastrophic"
# Terraform destroy on prod.

[[bash.pattern]]
match = "kubectl[[:space:]]+delete.*(prod|production)"
class = "Catastrophic"
# Kubectl delete against prod.

[[bash.pattern]]
match = "(?i)DELETE[[:space:]]+FROM[[:space:]]+[a-zA-Z_]+[[:space:]]*;"
class = "Catastrophic"
# DELETE FROM <table>; without WHERE — full-table wipe.

# --- 2026-07 db_ops evasion class: wrapper-fed + driver-level destructive SQL.
# The patterns below close the forms the three rules above miss: tautology
# WHEREs (1=1/true), delete-alls terminated by a quote or newline instead
# of a semicolon (here-string / heredoc / -c payloads), TRUNCATE without
# the TABLE keyword, inline-interpreter driver one-liners, and quoted /
# schema-qualified identifiers (`TRUNCATE "orders"`,
# `DELETE FROM "public"."orders"`, backtick-quoted MySQL forms) — the
# shared identifier fragment appears verbatim in each pattern since TOML
# regexes cannot reference each other. Each pattern requires a DB client
# or driver token in the same command so that grepping source for SQL
# strings, prose, and coreutils `truncate` do NOT match.
#
# POLICY (operator decision, 2026-07): these patterns grade what is
# VISIBLE in the command text. SQL the hook cannot read — a file
# (`psql prod -f x.sql`, `< dump.sql`) or an unresolved `$`-variable /
# `$(…)` payload — is deliberately NOT graded here: a shape-only deny is
# a guess, and over-blocking has a measured cost to agent task
# performance. Do not re-add opaque-source patterns. Also not covered:
# obfuscated/encoded payloads (semantic enforcement's domain).

[[bash.pattern]]
match = "(?i)(psql|pgcli|mysql|mariadb|mycli|sqlite3|mongosh)[^|&;]*DELETE[[:space:]]+FROM[[:space:]]+(\"[^\"]+\"|`[^`]+`|[A-Za-z_][A-Za-z0-9_]*)([.](\"[^\"]+\"|`[^`]+`|[A-Za-z_][A-Za-z0-9_]*))*[[:space:]]+WHERE[[:space:]]+('?1'?[[:space:]]*=[[:space:]]*'?1'?|true)"
class = "Catastrophic"
# DB client + DELETE … WHERE 1=1 (or WHERE true) — tautology full-table
# wipe. Covers -c payloads, here-strings, and heredocs alike (the SQL text
# is in the command string in every one of those forms). A real predicate
# (WHERE id=5) does not match. [^|&;] keeps the client and the SQL in the
# same shell statement.

[[bash.pattern]]
match = "(?i)(psql|pgcli|mysql|mariadb|mycli|sqlite3|mongosh)[^|&;]*DELETE[[:space:]]+FROM[[:space:]]+(\"[^\"]+\"|`[^`]+`|[A-Za-z_][A-Za-z0-9_]*)([.](\"[^\"]+\"|`[^`]+`|[A-Za-z_][A-Za-z0-9_]*))*[[:space:]]*(['\"]|\n|$)"
class = "Catastrophic"
# DB client + DELETE FROM <table> terminated by a closing quote, a newline
# (heredoc body line), or end-of-command — a delete-all that dodges the
# semicolon rule above. A scoped delete continues with " WHERE …" and does
# not match.

[[bash.pattern]]
match = "(?i)(echo|printf|cat)[^|]*DELETE[[:space:]]+FROM[[:space:]]+(\"[^\"]+\"|`[^`]+`|[A-Za-z_][A-Za-z0-9_]*)([.](\"[^\"]+\"|`[^`]+`|[A-Za-z_][A-Za-z0-9_]*))*([[:space:]]+WHERE[[:space:]]+('?1'?[[:space:]]*=[[:space:]]*'?1'?|true)|[[:space:]]*['\"])[^|]*\\|[[:space:]]*(psql|pgcli|mysql|mariadb|mycli|sqlite3|mongosh)"
class = "Catastrophic"
# echo/printf/cat piping a delete-all (quote-terminated or tautology-WHERE)
# into a DB client. A scoped delete piped the same way does not match, and
# an echo WITHOUT the pipe into a client (plain printing) does not match.

[[bash.pattern]]
match = "(?i)(psql|pgcli|mysql|mariadb|mycli|sqlite3|mongosh)[^|&;]*['\"][[:space:]]*TRUNCATE[[:space:]]+(\"|`|[A-Za-z_])"
class = "Catastrophic"
# Quoted TRUNCATE <table> without the TABLE keyword fed directly to a DB
# client (-c payload / here-string / heredoc); the table may itself be a
# quoted identifier (`TRUNCATE "orders"`). The leading-quote requirement
# keeps coreutils `truncate -s 0 file` out.

[[bash.pattern]]
match = "(?i)(echo|printf|cat)[^|]*TRUNCATE[[:space:]]+(\"|`|[A-Za-z_])[^|]*\\|[[:space:]]*(psql|pgcli|mysql|mariadb|mycli|sqlite3|mongosh)"
class = "Catastrophic"
# echo/printf/cat piping a TRUNCATE into a DB client. The pipe into the
# client is REQUIRED — merely echoing the word TRUNCATE does not match.

[[bash.pattern]]
match = "(?i)(psycopg2|asyncpg|sqlalchemy|mysql2|pymysql|mysql[.]connector|pymongo|mongoose|sequelize|knex|typeorm|require[(]['\"](pg|mysql2?|mariadb|mongodb)['\"][)])[^|&]*(DELETE[[:space:]]+FROM[[:space:]]+(\"[^\"]+\"|`[^`]+`|[A-Za-z_][A-Za-z0-9_]*)([.](\"[^\"]+\"|`[^`]+`|[A-Za-z_][A-Za-z0-9_]*))*([[:space:]]*['\")]|[[:space:]]+WHERE[[:space:]]+('?1'?[[:space:]]*=[[:space:]]*'?1'?|true))|['\"][[:space:]]*TRUNCATE[[:space:]]+(\"|`|[A-Za-z_])|drop_all|drop_database|drop_collection)"
class = "Catastrophic"
# Driver-level destruction in an inline interpreter one-liner
# (python -c / node -e / ruby -e): a DB driver token plus a delete-all
# (quote/paren-terminated or tautology-WHERE), a quoted TRUNCATE, or an
# ORM mass-drop helper (drop_all / drop_database / drop_collection).
# Merely importing a driver, SELECTs, and scoped deletes do not match.

[[bash.pattern]]
match = "(?i)['\"](DELETE[[:space:]]+FROM[[:space:]]+(\"[^\"]+\"|`[^`]+`|[A-Za-z_][A-Za-z0-9_]*)([.](\"[^\"]+\"|`[^`]+`|[A-Za-z_][A-Za-z0-9_]*))*([[:space:]]+WHERE[[:space:]]+('?1'?[[:space:]]*=[[:space:]]*'?1'?|true)|[[:space:]]*)|TRUNCATE[[:space:]]+(\"|`|[A-Za-z_])[^'\"]*)['\"].*(psql|pgcli|mysql|mariadb|mycli|sqlite3|mongosh)[^|&]*[$]"
class = "Catastrophic"
# Visible destructive payload handed over through a variable in the SAME
# command: a quoted delete-all / tautology-WHERE / TRUNCATE assignment
# followed by a client invocation taking a `$` payload
# (`SQL=\"DELETE FROM orders\"; psql dev -c \"$SQL\"`). Env-agnostic —
# the destructive text is visible, so target naming does not matter. This
# is NOT an opaque-payload rule: the statement is readable right there.
# A scoped assignment (`SQL=\"DELETE FROM x WHERE id=5\"`) does not match.

[[bash.pattern]]
match = "aws[[:space:]]+s3[[:space:]]+rb[[:space:]]+.*--force"
class = "Catastrophic"
# `aws s3 rb --force` — bucket-with-contents deletion. The bucket
# AND every object in it are gone; no soft-delete unless versioning
# was on (often isn't).

[[bash.pattern]]
match = "aws[[:space:]]+rds[[:space:]]+delete-db-instance.*--skip-final-snapshot"
class = "Catastrophic"
# RDS instance delete without taking the final snapshot. The
# `--skip-final-snapshot` flag is the explicit "I don't want to
# keep the data" choice; without it, RDS keeps a snapshot you can
# restore from.

[[bash.pattern]]
match = "aws[[:space:]]+iam[[:space:]]+delete-(user|role|policy)"
class = "Catastrophic"
# IAM principal deletion — breaks anything using the identity.
# Recovery requires recreating + re-binding everywhere; in
# practice teams declare the surface lost and migrate.

[[bash.pattern]]
match = "^gcloud[[:space:]]+projects[[:space:]]+delete"
class = "Catastrophic"
# GCP project delete — 30-day soft-delete, but the time window is
# easy to miss and the action drops every service in the project.

[[bash.pattern]]
match = "kubectl[[:space:]]+delete[[:space:]]+(namespace|ns)([[:space:]]|$)"
class = "Catastrophic"
# Namespace delete is mass-delete: every workload, service,
# configmap, secret, pvc in the namespace goes with it.

[[bash.pattern]]
match = "^(helm[[:space:]]+uninstall|helm[[:space:]]+delete).*(prod|production)"
class = "Catastrophic"
# Helm uninstall on a prod-tagged release. Removes every resource
# the chart created.

[[bash.pattern]]
match = "^gh[[:space:]]+repo[[:space:]]+delete"
class = "Catastrophic"
# `gh repo delete` — repo + every fork relationship + every
# downstream CI integration gone. Recovery is "did anyone keep a
# clone".

[[bash.pattern]]
match = "^dropdb([[:space:]]|$)"
class = "Catastrophic"
# Postgres `dropdb` CLI — drops an entire database. The DROP
# DATABASE SQL pattern above only catches the in-SQL form;
# this catches the CLI shorthand.

[[bash.pattern]]
match = "git[[:space:]]+push[[:space:]]+(--force|-f)[[:space:]]+.*[[:space:]]+(release|prod|production)"
class = "Catastrophic"
# Force-push to release/prod branches. The existing rule above
# only catches main/master; this widens to other commonly-
# protected branch names.

[[bash.pattern]]
match = "^(chmod[[:space:]]+777|chmod[[:space:]]+-R[[:space:]]+777)[[:space:]]+/(etc|usr|var|bin|sbin)"
class = "Catastrophic"
# chmod 777 on a system directory — security catastrophe and
# pragmatically irreversible (no record of prior modes).

# --- Irreversible: visible outside operator control ------------------------

[[bash.pattern]]
match = "git[[:space:]]+push[[:space:]]+--force-with-lease"
class = "ReversibleWithEffort"
# --force-with-lease is the safer flag; demoted from the generic
# force-push catastrophic above only when explicitly used.

[[bash.pattern]]
match = "^git[[:space:]]+push([[:space:]]|$)"
class = "Irreversible"
# Plain git push — visible in shared history; recovery requires force-push.

[[bash.pattern]]
match = "^terraform[[:space:]]+apply"
class = "Irreversible"
# Terraform apply (non-prod variant captured above for catastrophic).

[[bash.pattern]]
match = "^(npm|pnpm|yarn|bun)[[:space:]]+publish"
class = "Irreversible"
# Package publish — visible to the registry; unpublish has tight time windows.

[[bash.pattern]]
match = "^cargo[[:space:]]+publish"
class = "Irreversible"
# Crates.io publish — irrevocable per crates.io policy.

[[bash.pattern]]
match = "^(gh|hub)[[:space:]]+pr[[:space:]]+create"
class = "Irreversible"
# Public PR creation — visible to reviewers / CI / external audiences.

[[bash.pattern]]
match = "^(gh|hub)[[:space:]]+release[[:space:]]+create"
class = "Irreversible"
# GitHub release.

[[bash.pattern]]
match = "^docker[[:space:]]+push"
class = "Irreversible"
# Docker image push.

# --- ReversibleWithEffort: local + recoverable ----------------------------

[[bash.pattern]]
match = "^git[[:space:]]+(commit|reset|checkout|stash|branch|merge|rebase)([[:space:]]|$)"
class = "ReversibleWithEffort"
# Git operations confined to the local working tree (until push).

[[bash.pattern]]
match = "^(cargo|npm|pnpm|yarn|bun)[[:space:]]+(build|test|check|fmt|clippy|run)"
class = "ReversibleWithEffort"
# Local build / test commands — produce artifacts in target/ etc.

# --- TriviallyReversible: read-only observation ---------------------------

[[bash.pattern]]
match = "^(ls|cat|head|tail|grep|find|file|wc|stat|du|df|ps|top|env|which|whoami|pwd)([[:space:]]|$)"
class = "TriviallyReversible"
# Plain read-only Unix commands.

[[bash.pattern]]
match = "^git[[:space:]]+(status|log|diff|show|branch[[:space:]]+--list|remote[[:space:]]+(-v|show)|worktree[[:space:]]+list|reflog)"
class = "TriviallyReversible"
# Read-only git introspection.

[[bash.pattern]]
match = "^(echo|printf|true|false|exit|history|date)([[:space:]]|$)"
class = "TriviallyReversible"
# Built-in / shell-internal commands that don't touch state.

# ---------------------------------------------------------------------------
# Layer 3.5: file-path patterns for Write / Edit / NotebookEdit
# ---------------------------------------------------------------------------
#
# Matched against the edited file's path (normalized to forward slashes, so
# one pattern covers Windows + POSIX). First-match wins; an unmatched edit
# falls through to the Layer-1 builtin default (ReversibleWithEffort).
#
# Why: the four-check `tool_usage_gate` (sequential-thinking + task + PLAN
# MODE + active task) treats every Edit/Write as ReversibleWithEffort, which
# forces Plan Mode even for a one-line memory-atom note or a `plans/*.md`
# scratch file. Those writes are local, recoverable, and explicitly NOT
# implementation work — the gate's own docstring already says memory writes
# *should* be TriviallyReversible. These patterns make that real.

[[path.pattern]]
match = "(?i)/\\.claude/projects/[^/]+/memory/"
class = "TriviallyReversible"
# Memory-atom store: ~/.claude/projects/<project-key>/memory/*.md (incl.
# MEMORY.md, which lives in that dir). Pure local recall notes.

[[path.pattern]]
match = "(?i)/plans/[^/]+\\.md$"
class = "TriviallyReversible"
# Plan scratch files under any `plans/` dir (the gate's own resumed-session
# fallback writes here; authoring one shouldn't itself require Plan Mode).

# ---------------------------------------------------------------------------
# Layer 4: operator overrides (empty in the shipped defaults file —
# operators add their own in a sibling config/reversibility.toml)
# ---------------------------------------------------------------------------

[overrides]
# Example (commented out — operators uncomment + add their own):
# "mcp__custom__safe_tool" = "TriviallyReversible"
# "mcp__ba_orchestrator__publish_exec_deck" = "Catastrophic"

# Claude Code orchestration tools. These spawn sub-agents / fan-out work but
# do NOT themselves mutate durable state — each sub-action a workflow performs
# is re-gated individually by the same reversibility stack. Without these
# entries they hit the unknown-tool fallback (Irreversible) and the dry-run
# auditor blocks every Workflow/Agent/Task call. Classifying the orchestrators
# themselves as trivially reversible lets the per-action gates do the real work.
"Workflow" = "TriviallyReversible"
"Agent" = "TriviallyReversible"
"Task" = "TriviallyReversible"
"TaskCreate" = "TriviallyReversible"
"TaskUpdate" = "TriviallyReversible"

# Codex (codex-mcp) — an LLM coding agent reachable over MCP. The top-level
# orchestrator tools (`codex`, `codex_reply`) and its read/introspection tools
# (`read_file`, `grep_files`, `list_dir`) have NO side effect by themselves —
# `codex`/`codex_reply` run a reasoning session and RETURN text; reading a file
# observes. Without an entry these hit the conservative unknown-MCP default
# (Irreversible) and land at the A3 dry-run + DUAL-frontier-auditor gate, where
# (a) the codex schema can't carry _intent/_reasoning/_expected_effect and
# (b) an inconclusive dual audit (one frontier model unreachable) BLOCKS — so a
# read-only adversarial review is unrunnable whenever an auditor API blips. The
# genuinely-mutating sub-tools stay Irreversible (below) and are gated on their
# own, individually — exactly where the real risk is.
[mcp.codex]
# --- Orchestrator + reads (TriviallyReversible: reason/observe, return text) ---
codex = "TriviallyReversible"
codex_reply = "TriviallyReversible"
read_file = "TriviallyReversible"
grep_files = "TriviallyReversible"
list_dir = "TriviallyReversible"
mcp_health_check = "TriviallyReversible"
mcp_list_servers = "TriviallyReversible"
mcp_restart_server = "ReversibleWithEffort"
# --- Mutations (stay Irreversible — gated individually, real risk lives here) ---
apply_patch = "Irreversible"
write_file = "Irreversible"
shell = "Irreversible"

# Gemini (gemini-mcp) — peer of codex: an LLM reachable over MCP whose tools
# (`gemini`, `gemini_reply`, `gemini_analyze_media`) run a reasoning/analysis
# session and RETURN text. Pure observation + generation, no external side
# effect. Same conservative-default deadlock as codex above; classify the
# read/advisory tools trivially reversible.
[mcp.gemini]
gemini = "TriviallyReversible"
gemini_reply = "TriviallyReversible"
gemini_analyze_media = "TriviallyReversible"
mcp_health_check = "TriviallyReversible"
mcp_list_servers = "TriviallyReversible"
mcp_restart_server = "ReversibleWithEffort"
